[package]
name = "advanced-editing"
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false

# The plugin's WebAssembly module: ./build.sh (see README.md).
[lib]
crate-type = ["cdylib"]

[dependencies]
rustgis-plugin = { git = "https://github.com/opengeos/rustgis-plugins" }
geo = { version = "0.33.1", default-features = false }
i_overlay = { version = "~4.5", default-features = false }
serde_json = "1"

[features]
# Extra commands the test harness uses to check the shared modules; never in a release package.
diagnostics = []

# Small, fast modules. A panic aborts the call and RustGIS reports it as a plugin error.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
